name: Sincronizar base CAEPI

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Baixar base oficial do CAEPI
        run: |
          curl --fail --silent --show-error --ftp-pasv \
            --user anonymous:anonymous \
            "ftp://ftp.mtps.gov.br/portal/fiscalizacao/seguranca-e-saude-no-trabalho/caepi/tgg_export_caepi.zip" \
            --output caepi.zip
          unzip -p caepi.zip tgg_export_caepi.txt > tgg_export_caepi.txt

      - name: Obter token OIDC do GitHub
        id: oidc
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('supabase-caepi-import')
            core.setOutput('token', token)

      - name: Importar registros no Supabase
        env:
          CA_IMPORT_FUNCTION_URL: https://uedqxkzprueezjarhzql.supabase.co/functions/v1/caepi-import
          CA_IMPORT_AUTH_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npm run import:caepi -- tgg_export_caepi.txt
